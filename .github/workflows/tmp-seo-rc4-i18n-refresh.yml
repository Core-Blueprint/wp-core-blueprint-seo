name: Temporary SEO rc4 i18n refresh

on:
  push:
    branches:
      - feature/wp-native-seo-importer
    paths:
      - 'tools/tmp-refresh-i18n.py'
      - '.github/workflows/tmp-seo-rc4-i18n-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check polib
      - run: python tools/tmp-refresh-i18n.py
      - name: Commit refreshed catalogs
        run: |
          git config user.name "Core Blueprint CI"
          git config user.email "actions@users.noreply.github.com"
          git add languages/
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "Refresh SEO rc4 translation catalogs"
          git push origin HEAD:feature/wp-native-seo-importer
