name: SEO Golden diagnostics

on:
  push:
    branches:
      - golden/seo-marketplace-hardening

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: golden/seo-marketplace-hardening
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: wp-cli

      - run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Collect diagnostics
        shell: bash
        run: |
          set +e
          OUT=/tmp/seo-golden-diagnostics.txt
          : > "$OUT"
          echo "== PHP lint changed files ==" >> "$OUT"
          for file in core-blueprint-seo.php src/Requirements.php src/Bootstrap.php src/Compatibility/RuntimeGate.php src/Discovery/Runtime.php src/Schema/Runtime.php src/Governance/Audit.php src/State.php src/Lifecycle.php tests/golden-marketplace-regression.php tests/runtime-conflict-wordpress.php tests/runtime-seo-wordpress.php; do
            echo "-- $file" >> "$OUT"
            php -l "$file" >> "$OUT" 2>&1
            echo "exit=$?" >> "$OUT"
          done
          echo >> "$OUT"
          echo "== Golden regression ==" >> "$OUT"
          php tests/golden-marketplace-regression.php >> "$OUT" 2>&1
          echo "exit=$?" >> "$OUT"
          echo >> "$OUT"
          echo "== i18n update ==" >> "$OUT"
          tools/i18n/update >> "$OUT" 2>&1
          echo "exit=$?" >> "$OUT"
          echo >> "$OUT"
          echo "== i18n check after update ==" >> "$OUT"
          tools/i18n/check >> "$OUT" 2>&1
          echo "exit=$?" >> "$OUT"
          cat "$OUT"

      - name: Commit diagnostics
        if: always()
        run: |
          cp /tmp/seo-golden-diagnostics.txt SEO-GOLDEN-DIAGNOSTICS.txt
          git config user.name "Core Blueprint CI"
          git config user.email "actions@users.noreply.github.com"
          git add SEO-GOLDEN-DIAGNOSTICS.txt
          git commit -m "chore: capture SEO Golden diagnostics" || true
          git push origin HEAD:golden/seo-marketplace-hardening
