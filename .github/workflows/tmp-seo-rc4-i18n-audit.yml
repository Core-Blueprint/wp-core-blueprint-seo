name: Temporary SEO rc4 i18n audit

on:
  push:
    branches:
      - feature/wp-native-seo-importer
    paths:
      - 'tools/tmp-audit-i18n.py'
      - '.github/workflows/tmp-seo-rc4-i18n-audit.yml'
      - 'languages/**'
      - 'src/**'
      - 'core-blueprint-seo.php'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check polib
      - run: python tools/tmp-audit-i18n.py
