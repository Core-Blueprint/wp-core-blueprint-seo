name: Temporary SEO rc4 final QC

on:
  push:
    branches:
      - feature/wp-native-seo-importer
    paths:
      - '.github/workflows/tmp-seo-rc4-final-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y gettext
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Base and importer contract assertions
        run: |
          grep -Fq 'final class State implements ModuleStateInterface' src/State.php
          grep -Fq 'ModuleStateInterface' src/Requirements.php
          ! grep -Fq 'MasterSwitch' src/Requirements.php
          test ! -e src/Migration/SeoPressImporter.php
          grep -Fq 'WordPressMetadataImporter' src/Admin/SettingsPage.php
          grep -Fq 'seo_metadata_imported' src/Bootstrap.php
          grep -Fq 'Version:     1.0.0-rc4' core-blueprint-seo.php
          grep -Fq "define( 'CB_SEO_VERSION', '1.0.0-rc4' );" core-blueprint-seo.php
      - name: Translation catalog validation
        run: |
          set -euo pipefail
          POT=languages/core-blueprint-seo.pot
          for locale in nl_NL de_DE fr_FR es_ES it_IT pt_PT; do
            po="languages/core-blueprint-seo-${locale}.po"
            test -f "$po"
            test -f "languages/core-blueprint-seo-${locale}.mo"
            msgfmt --check --check-format -o "/tmp/${locale}.mo" "$po"
            msgcmp --use-fuzzy "$po" "$POT"
          done
          ! grep -Fq 'Import SEOPress data' "$POT"
          ! grep -Fq 'SEOPress migration' "$POT"
          grep -Fq 'Import existing SEO metadata' "$POT"
          grep -Fq 'SEO metadata imported' "$POT"
      - name: Temporary-file guard
        run: |
          test ! -e tools/tmp-audit-i18n.py
          test ! -e tools/tmp-refresh-i18n.py
          test ! -e .github/workflows/tmp-seo-rc4-i18n-audit.yml
          test ! -e .github/workflows/tmp-seo-rc4-i18n-refresh.yml
