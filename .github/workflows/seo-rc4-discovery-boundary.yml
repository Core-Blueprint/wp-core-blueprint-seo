name: SEO rc4 discovery boundary patch

on:
  push:
    branches:
      - feature/wp-native-seo-importer
    paths:
      - .github/workflows/seo-rc4-discovery-boundary.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/wp-native-seo-importer

      - name: Tighten discovery boundary and wording
        run: |
          python <<'PY'
          from pathlib import Path

          importer = Path('src/Migration/WordPressMetadataImporter.php')
          text = importer.read_text()

          old_context = "\t\t$seo_context = $has( 'seo' ) || $has( 'meta' ) || $contains( 'seo' ) || $contains( 'metadata' );"
          new_context = "\t\t$seo_text_context = $has( 'seo' ) || $contains( 'seo' ) || $contains( 'meta_title' ) || $contains( 'metatitle' ) || $contains( 'meta_description' ) || $contains( 'metadescription' ) || $contains( 'meta_desc' ) || $contains( 'metadesc' );"
          if old_context not in text:
              raise SystemExit('Expected SEO context expression not found')
          text = text.replace(old_context, new_context, 1)

          old_mapping = """\t\tif ( $has( 'title' ) || $contains( 'metatitle' ) || $contains( 'meta_title' ) ) {\n\t\t\treturn [ 'target' => 'title', 'confidence' => $seo_context ? 'automatic' : 'review' ];\n\t\t}\n\t\tif ( $has( 'description' ) || $has( 'desc' ) || $contains( 'metadescription' ) || $contains( 'meta_description' ) || $contains( 'metadesc' ) || $contains( 'meta_desc' ) ) {\n\t\t\treturn [ 'target' => 'description', 'confidence' => $seo_context ? 'automatic' : 'review' ];\n\t\t}\n"""
          new_mapping = """\t\tif ( $seo_text_context && ( $has( 'title' ) || $contains( 'metatitle' ) || $contains( 'meta_title' ) ) ) {\n\t\t\treturn [ 'target' => 'title', 'confidence' => 'automatic' ];\n\t\t}\n\t\tif ( $seo_text_context && ( $has( 'description' ) || $has( 'desc' ) || $contains( 'metadescription' ) || $contains( 'meta_description' ) || $contains( 'metadesc' ) || $contains( 'meta_desc' ) ) ) {\n\t\t\treturn [ 'target' => 'description', 'confidence' => 'automatic' ];\n\t\t}\n"""
          if old_mapping not in text:
              raise SystemExit('Expected title/description mapping block not found')
          importer.write_text(text.replace(old_mapping, new_mapping, 1))

          settings = Path('src/Admin/SettingsPage.php')
          text = settings.read_text()
          old_copy = "Core Blueprint scans WordPress post and term metadata for field names with recognizable SEO semantics. Discovery is vendor-neutral: it does not identify or target plugin brands."
          new_copy = "Core Blueprint discovers existing WordPress metadata by field semantics rather than vendor-specific import profiles. Stored field names are shown as-is so you can review the source before importing."
          if old_copy not in text:
              raise SystemExit('Expected importer intro copy not found')
          settings.write_text(text.replace(old_copy, new_copy, 1))
          PY

      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Importer semantic smoke
        run: |
          php <<'PHP'
          <?php
          define('ABSPATH', __DIR__ . '/');
          require __DIR__ . '/src/Migration/WordPressMetadataImporter.php';

          $method = new ReflectionMethod(CB\SEO\Migration\WordPressMetadataImporter::class, 'infer_target');
          $method->setAccessible(true);

          $cases = [
              '_generic_seo_title' => ['title', 'automatic'],
              '_legacy_meta_description' => ['description', 'automatic'],
              '_seopress_titles_title' => ['title', 'automatic'],
              '_seopress_titles_desc' => ['description', 'automatic'],
              '_legacy_canonical_url' => ['canonical', 'automatic'],
              '_legacy_robots_noindex' => ['noindex', 'automatic'],
              '_legacy_social_twitter_title' => ['social_title', 'automatic'],
              '_legacy_social_fb_img_attachment_id' => ['social_image_id', 'automatic'],
          ];

          foreach ($cases as $key => $expected) {
              $actual = $method->invoke(null, $key);
              if (!is_array($actual) || $actual['target'] !== $expected[0] || $actual['confidence'] !== $expected[1]) {
                  fwrite(STDERR, "Unexpected inference for {$key}: " . var_export($actual, true) . PHP_EOL);
                  exit(1);
              }
          }

          foreach (['_variation_description', '_custom_title', '_product_description', '_internal_title', '_thumbnail_id'] as $key) {
              $actual = $method->invoke(null, $key);
              if (null !== $actual) {
                  fwrite(STDERR, "False-positive SEO candidate for {$key}: " . var_export($actual, true) . PHP_EOL);
                  exit(1);
              }
          }

          echo "Importer discovery boundary smoke passed." . PHP_EOL;
          PHP

      - name: Commit validated patch
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 1
          fi
          git config user.name "Core Blueprint CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/Migration/WordPressMetadataImporter.php src/Admin/SettingsPage.php
          git commit -m "Tighten SEO metadata discovery boundary"
          git push origin HEAD:feature/wp-native-seo-importer
